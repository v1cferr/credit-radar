[project]
name = "credit-radar"
version = "0.1.0"
description = "Personal credit intelligence and readiness system for the Brazilian credit market"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "pdfplumber>=0.11.10",
]

[project.scripts]
# The scheduled collector calls this, so the schedule does not depend on an
# HTTP route staying named the same.
credit-radar = "credit_radar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "credit_radar"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ANN",      # annotations
    "TID",      # tidy imports
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "ANN001"]
"migrations/**" = ["ANN201", "ANN001", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["credit_radar"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require a live PostgreSQL database",
    "live: tests that contact a real external provider over the network",
]
# `live` tests are excluded by default. The default suite must never depend on
# Banco Central being up, on a rate limit, or on a DOM that changed
# overnight: a suite that fails for reasons outside the repository stops being
# a signal. Run them deliberately with `uv run pytest -m live`, which
# overrides this because pytest honours the last -m it is given.
addopts = ["-m", "not live"]
