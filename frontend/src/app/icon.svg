  <rect width="32" height="32" rx="7" fill="#0f172a" />
  <circle cx="16" cy="16" r="9.5" stroke="#38bdf8" stroke-width="1.5" opacity="0.35" />
  <circle cx="16" cy="16" r="5.5" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
  <circle cx="16" cy="16" r="1.8" fill="#38bdf8" />
  <path d="M16 16 L25 10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
</svg>
